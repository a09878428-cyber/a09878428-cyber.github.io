
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANEES Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">
        <header class="header">
            <h1>ANEES</h1>
            <p>الآلة الحاسبة</p>
        </header>

        <div class="display">
            <div id="history"></div>
            <input type="text" id="screen"
                value="0" readonly aria-label="نتيجة العملية">
        </div>

        <div class="buttons">
            <button class="special" data-action="clear">AC</button>
            <button class="special" data-action="delete">⌫</button>
            <button class="special" data-value="%">%</button>
            <button class="operator" data-value="÷">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="×">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button data-action="sign">±</button>
            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="equal" data-action="calculate">=</button>
        </div>

        <footer>ANEES Calculator © 2026</footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
